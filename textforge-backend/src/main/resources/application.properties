spring.application.name=textforge-backend

# Profil actif par defaut (dev = H2 en memoire, sans besoin de Docker)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Base de donnees (surchargee par les variables d'environnement en prod/docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/textforge}
spring.datasource.username=${DB_USER:textforge}
spring.datasource.password=${DB_PASSWORD:textforge}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:changeme-super-secret-key-changeme-super-secret-key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- OpenAI ---
# La cle est OBLIGATOIRE en variable d'environnement, jamais en dur ici
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

server.port=${SERVER_PORT:8080}
